{# Renders one bound form field: label, required marker, widget, and errors. #}
<div class="form-group">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}
        {% if field.field.required %}<span class="form-required" aria-label="required">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.errors %}
    <div class="form-error">
        {% for error in field.errors %}
        <p>{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}
</div>
