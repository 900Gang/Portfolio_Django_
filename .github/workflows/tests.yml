# Runs the checks and the full test suite on every pull request and every
# push to main. Render deploys main automatically; with its auto-deploy set
# to "After CI checks pass", a change that breaks these never goes live.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway values: no DATABASE_URL means a local SQLite database, and
      # no GEMINI_API_KEY / RESEND_API_KEY means nothing calls Google or Resend.
      SECRET_KEY: ci-only-throwaway-key-not-used-anywhere-else-0123456789
      PYTHONUNBUFFERED: "1"
    steps:
      # Pinned to commit hashes: a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      # Exactly the versions and files Render installs: every package pinned
      # and hash-checked, and wheels only, so no setup script runs.
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements.lock

      - name: Django system checks (production settings)
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: nanomachine.xyz

      - name: Collect static files the way Render's build does
        run: python manage.py collectstatic --noinput
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: nanomachine.xyz

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "True"

      - name: Run the test suite
        run: python manage.py test
        env:
          DEBUG: "True"
